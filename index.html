<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Digital Clock</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Dark Theme Variables */
            --bg-gradient: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #121212);
            --glass-bg: rgba(16, 16, 24, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --toggle-bg: rgba(0, 0, 0, 0.4);
            --toggle-active: rgba(255, 255, 255, 0.15);
            --progress-fill: #ffffff;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-main: #1a1a2e;
            --text-muted: #4a4a6a;
            --toggle-bg: rgba(255, 255, 255, 0.6);
            --toggle-active: #ffffff;
            --progress-fill: #1a1a2e;
        }

        [data-theme="sunset"] {
            --bg-gradient: linear-gradient(-45deg, #ff512f, #dd2476, #ff7b00, #ff0844);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-muted: #ffd1d1;
            --toggle-bg: rgba(0, 0, 0, 0.2);
            --toggle-active: rgba(255, 255, 255, 0.2);
            --progress-fill: #ffffff;
        }

        [data-theme="ocean"] {
            --bg-gradient: linear-gradient(-45deg, #00c6ff, #0072ff, #020024, #090979);
            --glass-bg: rgba(0, 0, 0, 0.2);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #bde0ff;
            --toggle-bg: rgba(0, 0, 0, 0.3);
            --toggle-active: rgba(255, 255, 255, 0.2);
            --progress-fill: #00e5ff;
        }

        [data-theme="forest"] {
            --bg-gradient: linear-gradient(-45deg, #134e5e, #71b280, #0f2027, #2c5364);
            --glass-bg: rgba(0, 0, 0, 0.25);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #a8e6cf;
            --toggle-bg: rgba(0, 0, 0, 0.3);
            --toggle-active: rgba(255, 255, 255, 0.2);
            --progress-fill: #a8e6cf;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.4s ease, color 0.4s ease, border 0.4s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card */
        .clock-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .greeting {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .battery-status {
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: 400;
            color: var(--text-main);
            opacity: 0.8;
        }

        .top-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: var(--toggle-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            font-size: 1.1rem;
            box-shadow: var(--glass-shadow);
            transition: transform 0.2s ease, background 0.3s ease;
        }
        
        .icon-btn:hover {
            transform: scale(1.1);
            background: var(--toggle-active);
        }

        /* Time Display */
        .time-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        #time {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums; 
            letter-spacing: -3px;
        }

        .sec-ampm-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            margin-left: 15px;
            height: 100%;
        }

        /* Swapped Positions */
        #seconds {
            font-size: 2rem;
            font-weight: 400;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            margin-bottom: -5px;
        }

        #ampm {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Date & Quote Display */
        #date {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        #quote {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 30px;
            min-height: 20px;
        }

        /* Day Progress Bar */
        .progress-container {
            margin-bottom: 30px;
            text-align: left;
        }

        .progress-wrapper {
            width: 100%;
            height: 8px;
            background: var(--toggle-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--progress-fill);
            transition: width 1s linear;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Settings / Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pill-toggle {
            display: flex;
            background: var(--toggle-bg);
            border-radius: 30px;
            padding: 5px;
            border: 1px solid var(--glass-border);
        }

        .pill-option {
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .pill-option.active {
            background: var(--toggle-active);
            color: var(--text-main);
            box-shadow: var(--glass-shadow);
        }

        /* Responsive */
        @media (max-width: 550px) {
            .clock-container { padding: 30px 20px; }
            #time { font-size: 4.5rem; letter-spacing: -2px; }
            #seconds { font-size: 1.5rem; }
            #ampm { font-size: 1rem; }
            .pill-option { padding: 6px 12px; font-size: 0.75rem; }
            .greeting { font-size: 0.95rem; }
            .top-icons { gap: 8px; }
            .icon-btn { width: 35px; height: 35px; font-size: 1rem;}
        }
    </style>
</head>
<body data-theme="dark">

    <div class="clock-container" id="clockCard">
        <!-- Header (Greeting, Battery & Icons) -->
        <div class="top-bar">
            <div class="greeting">
                <span id="greeting">Good Evening,</span>
                <span class="battery-status" id="batteryStatus">🔋 --%</span>
            </div>
            <div class="top-icons">
                <button class="icon-btn" onclick="cycleTheme()" title="Change Theme">🎨</button>
                <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
            </div>
        </div>

        <!-- Main Clock -->
        <div class="time-wrapper">
            <div id="time">00:00</div>
            <div class="sec-ampm-wrapper">
                <div id="seconds">00</div>
                <div id="ampm">AM</div>
            </div>
        </div>
        
        <!-- Date & Dynamic Quote -->
        <div id="date">Loading Date...</div>
        <div id="quote">"Loading inspiration..."</div>

        <!-- Day Progress Tracking -->
        <div class="progress-container">
            <div class="progress-wrapper">
                <div class="progress-bar" id="dayProgress"></div>
            </div>
            <div class="progress-labels">
                <span>Day Progress</span>
                <span id="progressText">0%</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <!-- Format Toggle -->
            <div class="pill-toggle">
                <div class="pill-option active" id="btn-12h" onclick="setFormat(12)">12h</div>
                <div class="pill-option" id="btn-24h" onclick="setFormat(24)">24h</div>
            </div>
            
            <!-- Seconds Toggle -->
            <div class="pill-toggle">
                <div class="pill-option active" id="btn-sec-on" onclick="setSeconds(true)">Sec On</div>
                <div class="pill-option" id="btn-sec-off" onclick="setSeconds(false)">Sec Off</div>
            </div>
        </div>
    </div>

    <script>
        // --- STATE & DATA ---
        let is24HourMode = false;
        let showSeconds = true;
        
        const themes = ['dark', 'light', 'sunset', 'ocean', 'forest'];
        let currentThemeIndex = 0;

        const quotes = {
            morning: ["Seize the day!", "A fresh start.", "Make today amazing.", "Rise and shine."],
            afternoon: ["Keep up the momentum.", "Stay focused.", "You're doing great.", "Halfway there!"],
            evening: ["Reflect on your wins.", "Relax and unwind.", "Prepare for tomorrow.", "Peaceful evening."],
            night: ["Rest your mind.", "Dream big.", "Tomorrow is a new day.", "Recharge your energy."]
        };

        // --- ELEMENTS ---
        const timeEl = document.getElementById('time');
        const secondsEl = document.getElementById('seconds');
        const ampmEl = document.getElementById('ampm');
        const dateEl = document.getElementById('date');
        const greetingEl = document.getElementById('greeting');
        const quoteEl = document.getElementById('quote');
        const batteryEl = document.getElementById('batteryStatus');
        const progressBar = document.getElementById('dayProgress');
        const progressText = document.getElementById('progressText');

        // --- CLOCK & PROGRESS LOGIC ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            // Time of Day Logic (Greeting & Quotes)
            let timeOfDay = 'night';
            if (hours >= 5 && hours < 12) { timeOfDay = 'morning'; greetingEl.textContent = "Good Morning,"; }
            else if (hours >= 12 && hours < 17) { timeOfDay = 'afternoon'; greetingEl.textContent = "Good Afternoon,"; }
            else if (hours >= 17 && hours < 22) { timeOfDay = 'evening'; greetingEl.textContent = "Good Evening,"; }
            else { greetingEl.textContent = "Good Night,"; }

            // Set static quote once per hour based on hour hash to avoid flickering on every tick
            const quoteArray = quotes[timeOfDay];
            const quoteIndex = hours % quoteArray.length;
            quoteEl.textContent = `"${quoteArray[quoteIndex]}"`;

            // Day Progress Calculation
            const totalSecondsInDay = 86400;
            const elapsedSeconds = (hours * 3600) + (minutes * 60) + seconds;
            const progressPercent = ((elapsedSeconds / totalSecondsInDay) * 100).toFixed(1);
            progressBar.style.width = `${progressPercent}%`;
            progressText.textContent = `${progressPercent}%`;

            // Determine AM/PM
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            // Format 12h or 24h
            if (!is24HourMode) {
                hours = hours % 12;
                hours = hours ? hours : 12; // '0' becomes '12'
                ampmEl.style.display = 'block';
                ampmEl.textContent = ampm;
            } else {
                ampmEl.style.display = 'none';
            }

            // Pad numbers with leading zeros
            hours = hours.toString().padStart(2, '0');
            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');

            // Render Time
            timeEl.textContent = `${hours}:${minutes}`;
            secondsEl.textContent = seconds;

            // Render Date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateEl.textContent = now.toLocaleDateString('en-US', options);
        }

        // --- BATTERY API ---
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBattery(battery);
                battery.addEventListener('levelchange', () => updateBattery(battery));
                battery.addEventListener('chargingchange', () => updateBattery(battery));
            });
        } else {
            batteryEl.style.display = 'none'; // Hide if not supported
        }

        function updateBattery(battery) {
            const level = Math.round(battery.level * 100);
            const icon = battery.charging ? '⚡' : '🔋';
            batteryEl.textContent = `${icon} ${level}%`;
        }

        // --- TOGGLES & SETTINGS ---
        function setFormat(format) {
            is24HourMode = (format === 24);
            document.getElementById('btn-12h').classList.toggle('active', !is24HourMode);
            document.getElementById('btn-24h').classList.toggle('active', is24HourMode);
            updateClock();
        }

        function setSeconds(show) {
            showSeconds = show;
            // Manage visibility via CSS opacity or display
            secondsEl.style.display = showSeconds ? 'block' : 'none';
            document.getElementById('btn-sec-on').classList.toggle('active', showSeconds);
            document.getElementById('btn-sec-off').classList.toggle('active', !showSeconds);
        }

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const newTheme = themes[currentThemeIndex];
            document.body.setAttribute('data-theme', newTheme);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- INITIALIZATION ---
        setInterval(updateClock, 100); // 100ms interval for exact second syncing
        updateClock(); 
    </script>
</body>
</html>
